<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login Admin — Art Memory</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card reveal visible"><span class="eyebrow">ROBLOX PROFILE</span><h1>Login Admin</h1><p>Kelola profil, galeri, statistik, request, dan tema website.</p><form id="loginForm"><label for="email">Email Admin / Username demo</label><input id="email" type="text" placeholder="admin@email.com" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" placeholder="Password Supabase Auth" autocomplete="current-password" required><button class="primary-btn full" type="submit">MASUK ADMIN ✦</button><div class="form-error" id="loginError"></div></form><div class="auth-divider"></div><a class="back-link" href="index.html">← Kembali ke halaman pengunjung</a></section></main>
<script>const configured=window.SUPABASE_URL&&!window.SUPABASE_URL.includes('YOUR-PROJECT')&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_ANON_KEY.includes('YOUR_');const sb=configured?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;const form=document.getElementById('loginForm'),error=document.getElementById('loginError');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!sb){if(email==='KanjengCicak'&&password==='Cicak Ganteng 09'){sessionStorage.setItem('roblox_admin_logged_in','1');location.href='admin.html';return}error.textContent='Supabase belum dikonfigurasi. Mode demo memakai username lama.';return}const {data,error:err}=await sb.auth.signInWithPassword({email,password});if(err){error.textContent='Email atau password salah.';return}const {data:admin}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(!admin){await sb.auth.signOut();error.textContent='Akun ini belum diberi akses admin.';return}sessionStorage.setItem('roblox_admin_logged_in','1');location.href='admin.html'});</script></body></html>
